<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: sans-serif;
  background: #808080;
  display: flex;
  justify-content: center;
  padding-top: 80px;
}
.login-box {
  background: white;
  padding: 30px;
  width: 300px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
button {
  width: 100%;
  padding: 12px;
  background: blue;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
button:hover { background: darkblue; }
a { display: block; text-align: center; margin-top: 15px; color: blue; text-decoration: none; }
</style>
</head>
<body>

<div class="login-box">
  <h2 style="text-align:center;">Sign In</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button>Login</button>
  <a href="index.html">← Back to Home</a>
</div>

</body>
</html>
